version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: coinsend-postgres
    environment:
      POSTGRES_USER: coinsend
      POSTGRES_PASSWORD: coinsend123
      POSTGRES_DB: coinsend
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coinsend"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
