<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 40" fill="none">
  <defs>
    <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B794F4"/>
      <stop offset="100%" stop-color="#F5A623"/>
    </linearGradient>
  </defs>
  <!-- Coin mark -->
  <circle cx="20" cy="20" r="14" stroke="url(#lg)" stroke-width="2.5" fill="none"/>
  <text x="20" y="25" text-anchor="middle" font-size="14" font-weight="700" font-family="Inter,sans-serif" fill="url(#lg)">$</text>
  <!-- Wordmark -->
  <text x="44" y="26" font-size="20" font-weight="700" font-family="Inter,sans-serif" fill="#1E1038" letter-spacing="-0.5">coinsend</text>
</svg>